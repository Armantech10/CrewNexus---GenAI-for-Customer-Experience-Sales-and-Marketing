version: '3.8'

services:
  api:
    build: 
      context: ../../backend
      dockerfile: Dockerfile
    container_name: genai_api
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379
      - QDRANT_URL=http://qdrant:6333
      - POSTGRES_URL=postgresql://postgres:postgres@postgres:5432/genai_platform
    depends_on:
      - redis
      - qdrant
      - postgres
    volumes:
      - ../../backend:/app
    networks:
      - genai_network

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    container_name: genai_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - api
    volumes:
      - ../../frontend:/app
      - /app/node_modules
    networks:
      - genai_network

  redis:
    image: redis:7-alpine
    container_name: genai_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - genai_network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: genai_qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - genai_network

  postgres:
    image: postgres:16-alpine
    container_name: genai_postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=genai_platform
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - genai_network

networks:
  genai_network:
    driver: bridge

volumes:
  redis_data:
  qdrant_data:
  postgres_data:
